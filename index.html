<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Биомеханика: Рычаги в теле человека</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Mulish:wght@400;600;700&display=swap');

        :root {
            --bg: #08090f;
            --panel: #0f1117;
            --card: #141720;
            --border: rgba(255,255,255,0.07);
            --blue: #4f9fff;
            --violet: #8b5cf6;
            --green: #22d3a0;
            --red: #f45b5b;
            --text: #eef2ff;
            --muted: #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Mulish', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse 60% 40% at 20% 20%, rgba(79,159,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 80% 80%, rgba(139,92,246,0.07) 0%, transparent 60%);
        }

        #game-container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 36px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--blue), var(--violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        #subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Progress */
        #progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        #progress-bar-track {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--blue), var(--violet));
            border-radius: 99px;
            transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
        }
        #progress-label {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 700;
            white-space: nowrap;
        }

        /* SVG diagram area */
        #diagram-wrapper {
            width: 100%;
            height: 220px;
            background: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            overflow: hidden;
            position: relative;
        }

        #diagram-wrapper svg {
            width: 100%;
            height: 100%;
            transition: opacity 0.3s ease;
        }

        #diagram-wrapper.fade svg {
            opacity: 0;
        }

        /* Question */
        #question-text {
            font-size: 1.05rem;
            line-height: 1.65;
            color: #c7d2fe;
            margin-bottom: 22px;
            min-height: 68px;
            font-weight: 600;
        }

        /* Options */
        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 10px;
            background: var(--card);
            color: #d1d5db;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Mulish', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.22s ease;
            text-align: left;
        }

        .option-btn .tag {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unbounded', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
            color: var(--muted);
            transition: all 0.22s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #1c2030;
            border-color: rgba(79,159,255,0.35);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .option-btn:hover:not(:disabled) .tag {
            background: rgba(79,159,255,0.15);
            color: var(--blue);
        }

        .option-btn:disabled { cursor: not-allowed; }

        .option-btn.correct {
            background: rgba(34,211,160,0.1) !important;
            border-color: var(--green) !important;
            color: var(--green) !important;
        }
        .option-btn.correct .tag {
            background: rgba(34,211,160,0.2) !important;
            color: var(--green) !important;
        }

        .option-btn.wrong {
            background: rgba(244,91,91,0.08) !important;
            border-color: rgba(244,91,91,0.4) !important;
            color: rgba(244,91,91,0.6) !important;
            opacity: 0.65;
        }

        /* Result */
        #result-message {
            font-size: 1.1rem;
            font-weight: 700;
            min-height: 28px;
            margin-top: 18px;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .correct-ans { color: var(--green); }
        .wrong-ans { color: var(--red); }

        /* Footer */
        #footer-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        #score-display {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 700;
            background: rgba(255,255,255,0.04);
            padding: 7px 16px;
            border-radius: 99px;
            border: 1px solid var(--border);
        }

        .action-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--blue), var(--violet));
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Mulish', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            box-shadow: 0 4px 16px rgba(79,159,255,0.25);
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(79,159,255,0.35);
        }
        .action-btn:active { transform: translateY(0); }
    </style>
</head>
<body>
<div id="game-container">
    <h1>Биомеханика</h1>
    <div id="subtitle">Рычажные системы внутри нас</div>

    <div id="progress-wrap">
        <div id="progress-bar-track"><div id="progress-bar"></div></div>
        <div id="progress-label">1 / 10</div>
    </div>

    <div id="diagram-wrapper">
        <!-- SVG injected by JS -->
    </div>

    <p id="question-text"></p>

    <div id="options-container">
        <button class="option-btn" data-type="1"><span class="tag">I</span>Рычаг 1 рода — Равновесия</button>
        <button class="option-btn" data-type="2"><span class="tag">II</span>Рычаг 2 рода — Силы</button>
        <button class="option-btn" data-type="3"><span class="tag">III</span>Рычаг 3 рода — Скорости</button>
    </div>

    <p id="result-message"></p>

    <div id="footer-row">
        <div id="score-display">Счёт: 0</div>
        <button id="next-btn" class="action-btn" style="display:none;">Далее →</button>
        <button id="restart-btn" class="action-btn" style="display:none;">Заново ↻</button>
    </div>
</div>

// ─── GAME STATE ────────────────────────────────────────────────────────────────
let currentIndex = 0;
let score = 0;
let answeredCorrectly = false;

const diagramWrapper = document.getElementById("diagram-wrapper");
const questionText   = document.getElementById("question-text");
const options        = document.querySelectorAll(".option-btn");
const resultMessage  = document.getElementById("result-message");
const scoreDisplay   = document.getElementById("score-display");
const nextBtn        = document.getElementById("next-btn");
const restartBtn     = document.getElementById("restart-btn");
const progressBar    = document.getElementById("progress-bar");
const progressLabel  = document.getElementById("progress-label");

function loadQuestion() {
    const q = questions[currentIndex];

    answeredCorrectly = false;

    // fade out
    diagramWrapper.classList.add("fade");
    setTimeout(() => {
        diagramWrapper.innerHTML = diagrams[q.diagramKey];
        diagramWrapper.classList.remove("fade");
    }, 250);

    questionText.textContent = q.text;
    resultMessage.textContent = "";
    resultMessage.className = "";
    nextBtn.style.display = "none";
    restartBtn.style.display = "none";

    const pct = (currentIndex / questions.length) * 100;
    progressBar.style.width = pct + "%";
    progressLabel.textContent = `${currentIndex + 1} / ${questions.length}`;
    scoreDisplay.textContent = `Счёт: ${score}`;

    options.forEach(btn => {
        btn.disabled = false;
        btn.className = "option-btn";
        btn.style.display = "flex";
    });
    diagramWrapper.style.display = "flex";
}

function handleAnswer(e) {
    const selected = e.currentTarget;
    const answer   = selected.getAttribute("data-type");
    const q        = questions[currentIndex];

    if (answer === q.correctAnswer) {
        // Lock everything, show next
        options.forEach(btn => btn.disabled = true);
        selected.classList.add("correct");
        resultMessage.textContent = "✨ Прекрасно! Правильный ответ.";
        resultMessage.className = "correct-ans";
        if (!answeredCorrectly) score++;
        answeredCorrectly = true;
        scoreDisplay.textContent = `Счёт: ${score}`;
        nextBtn.style.display = "inline-flex";
    } else {
        // Mark this button wrong, keep others enabled
        selected.classList.add("wrong");
        selected.disabled = true;
        resultMessage.textContent = "💥 Не то! Попробуй ещё раз.";
        resultMessage.className = "wrong-ans";
    }
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        loadQuestion();
    } else {
        showFinal();
    }
}

function showFinal() {
    progressBar.style.width = "100%";
    progressLabel.textContent = "Финиш";
    diagramWrapper.style.display = "none";
    options.forEach(btn => btn.style.display = "none");
    nextBtn.style.display = "none";

    const pct = (score / questions.length) * 100;
    let fb = "";
    if (pct === 100) fb = "🥇 Идеально! Вы — профессор биомеханики!";
    else if (pct >= 70) fb = "🥈 Отличный результат! Прекрасное понимание кинематики.";
    else if (pct >= 50) fb = "🥉 Неплохо, но стоит повторить типы рычагов.";
    else fb = "📚 Изучите ещё раз рычаги в анатомии.";

    questionText.textContent = fb;
    resultMessage.textContent = `Итог: ${score} из ${questions.length}`;
    resultMessage.className = "";
    scoreDisplay.textContent = "Тест завершён!";
    restartBtn.style.display = "inline-flex";
}

function restart() {
    currentIndex = 0;
    score = 0;
    answeredCorrectly = false;
    diagramWrapper.style.display = "flex";
    loadQuestion();
}

options.forEach(btn => btn.addEventListener("click", handleAnswer));
nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", restart);

loadQuestion();
</script>
